  - id: S05
    title: Split late orders into seller delay and carrier delay
    kind: analysis
    goal: >-
      Apply this fixed rule to every late order-seller pair in order_seller.csv. handover_late = calendar date of the carrier
      timestamp is after the calendar date of shipping_limit_date. transit_budget = estimated date minus shipping_limit date
      (calendar days). carrier_over = (delivered date minus carrier date, calendar days) is greater than transit_budget.
      Class: 'seller only' = handover_late and not carrier_over (the carrier would have been on time had the seller been on time),
      'carrier only' = not handover_late, 'both' = handover_late and carrier_over, 'unclassified' = carrier timestamp missing
      or delivered before carrier. Summarise counts and shares, and counts by class within days-late bands 1-3, 4-7, 8-14, 15+.
      Also compare mean handling and transit days of late versus on-time pairs.
    brief_sections: [Research questions, Definitions]
    inputs: ["S02:outputs/order_seller.csv"]
    outputs: ["outputs/late_split.csv", "outputs/split_summary.csv", "outputs/split_by_band.csv"]
    results: [n_late_pairs, n_seller_only, n_carrier_only, n_both, n_unclassified, pct_seller_only, pct_carrier_only, pct_both, pct_seller_involved, handling_mean_late_days, handling_mean_ontime_days, transit_mean_late_days, transit_mean_ontime_days, pct_ontime_pairs_handover_late]
    definitions:
      n_late_pairs: "Order-seller pairs with late = 1 in order_seller.csv, rows of late_split.csv, count."
      n_seller_only: "Late pairs classified 'seller only' under the S05 rule, count."
      n_carrier_only: "Late pairs classified 'carrier only' under the S05 rule, count."
      n_both: "Late pairs classified 'both' under the S05 rule, count."
      n_unclassified: "Late pairs with missing carrier timestamp or delivery before carrier handover, count."
      pct_seller_only: "n_seller_only divided by classified late pairs (n_late_pairs minus n_unclassified), in %."
      pct_carrier_only: "n_carrier_only divided by classified late pairs, in %."
      pct_both: "n_both divided by classified late pairs, in %."
      pct_seller_involved: "(n_seller_only plus n_both) divided by classified late pairs, in % (late pairs where the seller handed over after the shipping limit)."
      handling_mean_late_days: "Mean handling_days over late pairs where handling_days is not missing, decimal days."
      handling_mean_ontime_days: "Mean handling_days over on-time pairs (late = 0) where handling_days is not missing, decimal days."
      transit_mean_late_days: "Mean transit_days over late pairs where transit_days is not missing, decimal days."
      transit_mean_ontime_days: "Mean transit_days over on-time pairs where transit_days is not missing, decimal days."
      pct_ontime_pairs_handover_late: "On-time pairs with a carrier timestamp whose carrier calendar date is after the shipping_limit calendar date, divided by on-time pairs with a carrier timestamp, in %."
    model: sonnet
    critical: true
    replication_method: "Reclassify with a single DuckDB SQL CASE expression (./cq sql) on order_seller.csv, using CAST to DATE and date differences, instead of pandas."
    tolerance_pct: 0.1
    checks:
      - {type: row_count, file: outputs/late_split.csv, min: 3000, max: 15000}
      - {type: unique, file: outputs/late_split.csv, columns: [order_id, seller_id]}
      - {type: no_missing, file: outputs/late_split.csv, columns: [order_id, seller_id, delay_days, split_class]}
      - {type: range, file: outputs/late_split.csv, column: delay_days, min: 1, max: 250}
      - {type: row_count, file: outputs/split_summary.csv, min: 4, max: 4}
      - {type: unique, file: outputs/split_summary.csv, columns: [split_class]}
      - {type: no_missing, file: outputs/split_summary.csv, columns: [split_class, late_pairs, share_pct]}
      - {type: range, file: outputs/split_summary.csv, column: share_pct, min: 0, max: 100}
      - {type: row_count, file: outputs/split_by_band.csv, min: 4, max: 4}
      - {type: unique, file: outputs/split_by_band.csv, columns: [days_late_band]}
      - {type: no_missing, file: outputs/split_by_band.csv, columns: [days_late_band, seller_only, both, carrier_only, unclassified]}
      - {type: result_range, result: n_late_pairs, min: 3000, max: 15000}
      - {type: result_range, result: n_unclassified, min: 0, max: 300}
      - {type: result_range, result: pct_seller_only, min: 0, max: 100}
      - {type: result_range, result: pct_carrier_only, min: 0, max: 100}
      - {type: result_range, result: pct_both, min: 0, max: 100}
      - {type: result_range, result: pct_seller_involved, min: 0, max: 100}
      - {type: result_range, result: handling_mean_late_days, min: 0.5, max: 20}
      - {type: result_range, result: handling_mean_ontime_days, min: 0.5, max: 10}
      - {type: result_range, result: transit_mean_late_days, min: 5, max: 60}
      - {type: result_range, result: transit_mean_ontime_days, min: 3, max: 20}
      - {type: result_range, result: pct_ontime_pairs_handover_late, min: 0, max: 50}
    time_min: 25
    time_max: 40
    stop_and_ask: "shipping_limit_date is missing for many pairs, more than 300 late pairs are unclassified, or the rule gives a 'carrier only' pair that is not actually carrier-over (would mean a date-handling bug)."
  - id: S06
    title: The few sellers and lanes behind most late orders (Pareto)
    kind: analysis
    goal: >-
      Rank all active sellers by late pairs (desc, ties seller_id asc), with cumulative late count and cumulative share of
      n_late_pairs; same for all active lanes (ties lane asc). No minimum volume. Find how many sellers and lanes are needed
      to reach 50% and 80% of late pairs, and the shares held by the top 20.
    brief_sections: [Research questions, Definitions]
    inputs: ["S02:outputs/order_seller.csv"]
    outputs: ["outputs/pareto_sellers.csv", "outputs/pareto_lanes.csv"]
    results: [n_sellers_with_late, n_sellers_for_50pct_late, pct_sellers_for_50pct_late, n_sellers_for_80pct_late, pct_sellers_for_80pct_late, top20_sellers_late_share_pct, n_lanes_with_late, n_lanes_for_80pct_late, pct_lanes_for_80pct_late, top20_lanes_late_share_pct]
    definitions:
      n_sellers_with_late: "Active sellers with at least one late order-seller pair, count."
      n_sellers_for_50pct_late: "Smallest number of top-ranked sellers (by late pairs) whose cumulative late pairs reach at least 50% of all late pairs, count."
      pct_sellers_for_50pct_late: "n_sellers_for_50pct_late divided by all active sellers (n_sellers_active), in %."
      n_sellers_for_80pct_late: "Smallest number of top-ranked sellers whose cumulative late pairs reach at least 80% of all late pairs, count."
      pct_sellers_for_80pct_late: "n_sellers_for_80pct_late divided by all active sellers, in %."
      top20_sellers_late_share_pct: "Late pairs of the 20 top-ranked sellers divided by all late pairs, in %."
      n_lanes_with_late: "Active lanes with at least one late pair, count."
      n_lanes_for_80pct_late: "Smallest number of top-ranked lanes (by late pairs) whose cumulative late pairs reach at least 80% of all late pairs, count."
      pct_lanes_for_80pct_late: "n_lanes_for_80pct_late divided by all active lanes (n_lanes_active), in %."
      top20_lanes_late_share_pct: "Late pairs on the 20 top-ranked lanes divided by all late pairs, in %."
    model: sonnet
    critical: true
    replication_method: "Recompute rankings and cumulative shares with DuckDB SQL window functions (SUM OVER ORDER BY late DESC, id ASC) via ./cq sql, instead of pandas."
    tolerance_pct: 0.1
    checks:
      - {type: row_count, file: outputs/pareto_sellers.csv, min: 2500, max: 3200}
      - {type: unique, file: outputs/pareto_sellers.csv, columns: [seller_id]}
      - {type: no_missing, file: outputs/pareto_sellers.csv, columns: [rank, seller_id, late, delivered, cum_late, cum_late_share_pct]}
      - {type: range, file: outputs/pareto_sellers.csv, column: cum_late_share_pct, min: 0, max: 100}
      - {type: row_count, file: outputs/pareto_lanes.csv, min: 250, max: 729}
      - {type: unique, file: outputs/pareto_lanes.csv, columns: [lane]}
      - {type: range, file: outputs/pareto_lanes.csv, column: cum_late_share_pct, min: 0, max: 100}
      - {type: result_range, result: n_sellers_with_late, min: 500, max: 3000}
      - {type: result_range, result: n_sellers_for_50pct_late, min: 10, max: 1500}
      - {type: result_range, result: pct_sellers_for_50pct_late, min: 0.5, max: 50}
      - {type: result_range, result: n_sellers_for_80pct_late, min: 50, max: 2500}
      - {type: result_range, result: pct_sellers_for_80pct_late, min: 2, max: 80}
      - {type: result_range, result: top20_sellers_late_share_pct, min: 2, max: 60}
      - {type: result_range, result: n_lanes_with_late, min: 100, max: 729}
      - {type: result_range, result: n_lanes_for_80pct_late, min: 5, max: 400}
      - {type: result_range, result: pct_lanes_for_80pct_late, min: 1, max: 80}
      - {type: result_range, result: top20_lanes_late_share_pct, min: 20, max: 95}
    time_min: 20
    time_max: 35
    stop_and_ask: "The cumulative share does not end at exactly 100%, or late pairs here differ from S05's n_late_pairs."
  - id: S07
    title: How lateness relates to customer review scores
    kind: analysis
    goal: >-
      On clean orders with a review, compare review scores across delay bands: on time (delay <= 0), 1-3 days late, more
      than 3 days late. Sensitivity: repeat with cut-offs 2, 5 and 7 (bands on time, 1..k, more than k), and with a stricter
      on-time rule (late if the delivery timestamp is after 00:00 of the estimated date, so same-day deliveries count late).
      Report n, mean score and share of 1-2 star scores per band, and the Spearman correlation of delay_days with score.
      State that this is association, not cause.
    brief_sections: [Research questions, Answer standard, Definitions]
    inputs: ["S01:outputs/orders_clean.csv"]
    outputs: ["outputs/review_bands.csv"]
    results: [n_reviewed_orders, review_mean_ontime, review_mean_late_1_3, review_mean_late_gt3, review_gap_gt3, pct_low_ontime, pct_low_late_1_3, pct_low_late_gt3, review_mean_late_1_2, review_mean_late_gt2, review_mean_late_1_5, review_mean_late_gt5, review_mean_late_1_7, review_mean_late_gt7, review_mean_ontime_strict, review_mean_late_strict, spearman_delay_score]
    definitions:
      n_reviewed_orders: "Clean delivered orders with a review_score after de-duplication, count (equals n_clean_with_review)."
      review_mean_ontime: "Mean review_score of reviewed clean orders with delay_days <= 0, score 1-5."
      review_mean_late_1_3: "Mean review_score of reviewed clean orders with delay_days from 1 to 3, score 1-5."
      review_mean_late_gt3: "Mean review_score of reviewed clean orders with delay_days above 3, score 1-5."
      review_gap_gt3: "Difference in mean review score, on-time reviewed clean orders minus reviewed clean orders more than 3 days late (review_mean_ontime minus review_mean_late_gt3), in score points."
      pct_low_ontime: "Share of reviewed on-time orders (delay_days <= 0) with score 1 or 2, in %."
      pct_low_late_1_3: "Share of reviewed orders with delay_days 1 to 3 with score 1 or 2, in %."
      pct_low_late_gt3: "Share of reviewed orders with delay_days above 3 with score 1 or 2, in %."
      review_mean_late_1_2: "Mean review_score of reviewed clean orders with delay_days 1 or 2."
      review_mean_late_gt2: "Mean review_score of reviewed clean orders with delay_days above 2."
      review_mean_late_1_5: "Mean review_score of reviewed clean orders with delay_days 1 to 5."
      review_mean_late_gt5: "Mean review_score of reviewed clean orders with delay_days above 5."
      review_mean_late_1_7: "Mean review_score of reviewed clean orders with delay_days 1 to 7."
      review_mean_late_gt7: "Mean review_score of reviewed clean orders with delay_days above 7."
      review_mean_ontime_strict: "Mean review_score of reviewed clean orders whose delivery timestamp is at or before 00:00 of the estimated date (strict on-time rule)."
      review_mean_late_strict: "Mean review_score of reviewed clean orders whose delivery timestamp is after 00:00 of the estimated date (strict late rule)."
      spearman_delay_score: "Spearman rank correlation between delay_days and review_score over reviewed clean orders, unitless (-1 to 1)."
    model: sonnet
    critical: true
    replication_method: "Recompute band means and shares with DuckDB SQL (./cq sql) CASE bands and AVG, and the Spearman correlation as the Pearson correlation of RANK() values in SQL, instead of pandas."
    tolerance_pct: 0.5
    checks:
      - {type: row_count, file: outputs/review_bands.csv, min: 14, max: 14}
      - {type: unique, file: outputs/review_bands.csv, columns: [scheme, band]}
      - {type: no_missing, file: outputs/review_bands.csv, columns: [scheme, band, n_orders, mean_score, pct_low_score]}
      - {type: range, file: outputs/review_bands.csv, column: mean_score, min: 1, max: 5}
      - {type: range, file: outputs/review_bands.csv, column: pct_low_score, min: 0, max: 100}
      - {type: result_range, result: n_reviewed_orders, min: 90000, max: 96500}
      - {type: result_range, result: review_mean_ontime, min: 3.8, max: 4.8}
      - {type: result_range, result: review_mean_late_1_3, min: 2.0, max: 4.6}
      - {type: result_range, result: review_mean_late_gt3, min: 1.0, max: 4.0}
      - {type: result_range, result: review_gap_gt3, min: -1, max: 3.5}
      - {type: result_range, result: pct_low_ontime, min: 2, max: 20}
      - {type: result_range, result: pct_low_late_1_3, min: 2, max: 70}
      - {type: result_range, result: pct_low_late_gt3, min: 10, max: 90}
      - {type: result_range, result: review_mean_late_1_2, min: 1.5, max: 4.8}
      - {type: result_range, result: review_mean_late_gt2, min: 1.0, max: 4.5}
      - {type: result_range, result: review_mean_late_1_5, min: 1.5, max: 4.8}
      - {type: result_range, result: review_mean_late_gt5, min: 1.0, max: 4.5}
      - {type: result_range, result: review_mean_late_1_7, min: 1.5, max: 4.8}
      - {type: result_range, result: review_mean_late_gt7, min: 1.0, max: 4.5}
      - {type: result_range, result: review_mean_ontime_strict, min: 3.8, max: 4.8}
      - {type: result_range, result: review_mean_late_strict, min: 1.0, max: 4.5}
      - {type: result_range, result: spearman_delay_score, min: -0.8, max: 0.1}
    time_min: 25
    time_max: 40
    stop_and_ask: "Any band has fewer than 100 reviewed orders, or the review's creation date is before delivery for most late orders (scores would not reflect the delivery)."
  - id: S08
    title: Promised against actual delivery time by lane
    kind: analysis
    goal: >-
      For every lane in order_seller.csv compute delivered pairs, late rate, mean promised lead (est_lead_days_cal), mean
      actual lead (act_lead_days_cal), mean buffer (estimated date minus delivered date, calendar days) and 90th-percentile
      actual lead. Overall figures use orders_clean.csv. Size the problem on ranked lanes (at least 30 pairs) with a late
      rate of 15% or more and compare their buffer with all other pairs.
    brief_sections: [Research questions, Definitions]
    inputs: ["S01:outputs/orders_clean.csv", "S02:outputs/order_seller.csv"]
    outputs: ["outputs/lane_lead.csv"]
    results: [est_lead_mean_days, act_lead_mean_days_cal, buffer_mean_days, n_lanes_late_ge15, late_pairs_lanes_late_ge15, share_late_pairs_lanes_ge15_pct, buffer_mean_lanes_ge15_days, buffer_mean_other_days]
    definitions:
      est_lead_mean_days: "Mean est_lead_days_cal (estimated date minus purchase calendar date) over all clean delivered orders, days."
      act_lead_mean_days_cal: "Mean act_lead_days_cal (delivered calendar date minus purchase calendar date) over all clean delivered orders, days."
      buffer_mean_days: "Mean of (estimated date minus delivered calendar date) over all clean delivered orders, days (equals minus the mean delay_days)."
      n_lanes_late_ge15: "Lanes with at least 30 delivered order-seller pairs and a late rate of 15% or more, count."
      late_pairs_lanes_late_ge15: "Late order-seller pairs on the lanes counted in n_lanes_late_ge15, count."
      share_late_pairs_lanes_ge15_pct: "late_pairs_lanes_late_ge15 divided by all late order-seller pairs, in %."
      buffer_mean_lanes_ge15_days: "Mean buffer (estimated minus delivered calendar date) over all order-seller pairs on the lanes in n_lanes_late_ge15, days."
      buffer_mean_other_days: "Mean buffer over all order-seller pairs on all other lanes, days."
    model: sonnet
    critical: true
    replication_method: "Recompute with DuckDB SQL (./cq sql) GROUP BY lane with date differences, instead of pandas."
    tolerance_pct: 0.1
    checks:
      - {type: row_count, file: outputs/lane_lead.csv, min: 250, max: 729}
      - {type: unique, file: outputs/lane_lead.csv, columns: [lane]}
      - {type: no_missing, file: outputs/lane_lead.csv, columns: [lane, delivered, late_rate_pct, est_lead_mean_days, act_lead_mean_days, buffer_mean_days, ranked]}
      - {type: range, file: outputs/lane_lead.csv, column: late_rate_pct, min: 0, max: 100}
      - {type: range, file: outputs/lane_lead.csv, column: est_lead_mean_days, min: 0, max: 200}
      - {type: range, file: outputs/lane_lead.csv, column: act_lead_mean_days, min: 0, max: 250}
      - {type: result_range, result: est_lead_mean_days, min: 15, max: 35}
      - {type: result_range, result: act_lead_mean_days_cal, min: 8, max: 18}
      - {type: result_range, result: buffer_mean_days, min: 3, max: 20}
      - {type: result_range, result: n_lanes_late_ge15, min: 0, max: 400}
      - {type: result_range, result: late_pairs_lanes_late_ge15, min: 0, max: 15000}
      - {type: result_range, result: share_late_pairs_lanes_ge15_pct, min: 0, max: 100}
      - {type: result_range, result: buffer_mean_lanes_ge15_days, min: -20, max: 30}
      - {type: result_range, result: buffer_mean_other_days, min: -10, max: 30}
    time_min: 20
    time_max: 30
    stop_and_ask: "The overall mean buffer is not minus the mean delay_days within rounding, or no lane reaches 30 pairs."
  - id: S09
    title: Prepare the tables and chart data for the report
    kind: report
    goal: >-
      Build one tidy CSV per report item from earlier outputs, by code only, no typed numbers:
      t1_dq_log (copy of dq_log), t2_kpis (the 10 rows of kpi_overall: metric, value, unit),
      t3_top_bottom (worst 10 and best 10 ranked lanes, sellers and categories: dimension, list, rank, name, delivered, late, late_rate_pct),
      t4_split (4 classes: split_class, late_pairs, share_pct, mean_handling_days, mean_transit_days),
      t5_pareto (top 20 sellers and top 20 lanes: dimension, rank, name, late, delivered, late_rate_pct, cum_late_share_pct),
      t6_reviews (review_bands), c1_monthly (shown months only: month, on_time_rate_pct, late_share_pct),
      c2_state_late (customer_state, late_share_pct, sorted desc), c3_split_by_band, c4_pareto_curve (pct_of_sellers 1-100,
      cumulative late share of the top ceil(p% x active sellers) sellers), c5_review_bands (3 main bands: delay_band, n_orders, mean_score),
      c6_lane_lead (20 lanes with most delivered pairs: lane, delivered, est_lead_mean_days, act_lead_mean_days).
    brief_sections: [Report spec]
    inputs: ["S02:outputs/dq_log.csv", "S03:outputs/kpi_overall.csv", "S03:outputs/monthly.csv", "S04:outputs/late_by_seller.csv", "S04:outputs/late_by_lane.csv", "S04:outputs/late_by_category.csv", "S04:outputs/late_by_state.csv", "S05:outputs/split_summary.csv", "S05:outputs/split_by_band.csv", "S06:outputs/pareto_sellers.csv", "S06:outputs/pareto_lanes.csv", "S07:outputs/review_bands.csv", "S08:outputs/lane_lead.csv"]
    outputs: ["outputs/t1_dq_log.csv", "outputs/t2_kpis.csv", "outputs/t3_top_bottom.csv", "outputs/t4_split.csv", "outputs/t5_pareto.csv", "outputs/t6_reviews.csv", "outputs/c1_monthly.csv", "outputs/c2_state_late.csv", "outputs/c3_split_by_band.csv", "outputs/c4_pareto_curve.csv", "outputs/c5_review_bands.csv", "outputs/c6_lane_lead.csv"]
    model: sonnet
    critical: false
    checks:
      - {type: row_count, file: outputs/t1_dq_log.csv, min: 8, max: 30}
      - {type: no_missing, file: outputs/t1_dq_log.csv, columns: [issue, source_file, rows_found, action, rows_removed, reason]}
      - {type: row_count, file: outputs/t2_kpis.csv, min: 10, max: 10}
      - {type: unique, file: outputs/t2_kpis.csv, columns: [metric]}
