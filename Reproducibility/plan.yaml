  - id: S10
    title: Choose the three fixes to make first
    kind: report
    goal: >-
      Using only declared results from S01-S08, choose three concrete recommendations (for example a seller scorecard at the
      15% late-rate threshold, realistic promised dates on the lanes at or above 15% late, and a handover-deadline rule if
      seller delay dominates). Write t7_recommendations.csv with rec_no, recommendation, problem_targeted, size_result_id,
      size_value, supporting_result_ids. size_value must be read by code from the earlier step's result, not typed.
      No new numbers are created here.
    brief_sections: [Research questions, Answer standard, Out of scope]
    inputs: ["S03:outputs/kpi_overall.csv", "S04:outputs/late_by_seller.csv", "S05:outputs/split_summary.csv", "S06:outputs/pareto_sellers.csv", "S06:outputs/pareto_lanes.csv", "S07:outputs/review_bands.csv", "S08:outputs/lane_lead.csv"]
    outputs: ["outputs/t7_recommendations.csv"]
    model: opus
    model_reason: "Picking the three fixes that the evidence best supports, and tying each fairly to the size of its problem, is a judgement call."
    critical: false
    checks:
      - {type: row_count, file: outputs/t7_recommendations.csv, min: 3, max: 3}
      - {type: unique, file: outputs/t7_recommendations.csv, columns: [rec_no]}
      - {type: no_missing, file: outputs/t7_recommendations.csv, columns: [rec_no, recommendation, problem_targeted, size_result_id, size_value, supporting_result_ids]}
      - {type: range, file: outputs/t7_recommendations.csv, column: rec_no, min: 1, max: 3}
    time_min: 20
    time_max: 35
    stop_and_ask: "A sensible recommendation would need a number that no earlier step declared, or the evidence supports fewer than three distinct fixes."
  - id: S11
    title: Write the findings
    kind: findings
    goal: >-
      Apply the Brief's answer standard to Q1-Q4 and write research_findings.md from templates/findings.md. Say that Q3
      shows association, not cause, that multi-seller orders count once per seller in seller and lane figures, that thin
      months are left out of the monthly chart, and that operations-quality methods are applied to a parcel network.
    brief_sections: [Research questions, Answer standard, Definitions, Assumptions, Out of scope, Report spec]
    inputs: ["S02:outputs/dq_log.csv", "S03:outputs/kpi_overall.csv", "S05:outputs/split_summary.csv", "S07:outputs/review_bands.csv", "S09:outputs/t3_top_bottom.csv", "S09:outputs/t5_pareto.csv", "S10:outputs/t7_recommendations.csv"]
